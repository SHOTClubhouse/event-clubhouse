<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020304">
  <meta name="color-scheme" content="dark">
  <title>Live event | SHOT Event Clubhouse</title>
  <meta name="description" content="Live scores, tables, knockouts, fan voting and the clubhouse for this event, on your phone.">
  <link rel="icon" href="/assets/brand/shot-logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/brand/shot-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/event.css">
  <link rel="stylesheet" href="/css/fitness.css">
  <link rel="stylesheet" href="/css/clubhouse.css">
</head>
<body class="ece">
  <a class="ece-skip" href="#view">Skip to the event</a>
  <header id="head" class="ece-head">
    <div class="ece-wrap ece-head__in" aria-hidden="true">
      <div class="ece-toprow"><div class="ece-lock"><img class="ece-lock__shot" src="/assets/brand/shot-logo.png" alt="" height="26"></div></div>
      <div class="ec-skel" style="height:44px;width:70%;margin:6px 0 12px"></div>
      <div class="ec-skel" style="height:18px;width:50%"></div>
    </div>
  </header>
  <div id="stick" class="ece-stick">
    <nav class="ece-nav" aria-label="Sections"><div id="nav" class="ece-wrap ece-nav__in"></div></nav>
    <div id="banner" class="ece-banner" role="status" hidden></div>
  </div>
  <div id="stream" class="ece-wrap ece-streamhost" hidden></div>
  <main id="view" class="ece-wrap ece-main" tabindex="-1"></main>
  <footer class="ece-foot">
    <a class="ec-powered" href="/">Powered by <img src="/assets/brand/shot-logo.png" alt="SHOT" height="22"></a>
    <a class="ece-foot__link" href="/">Run your own event on SHOT</a>
  </footer>
  <div id="announce" class="ece-sr" role="status" aria-live="polite" aria-atomic="true"></div>
  <noscript><p class="ece-wrap" style="padding:24px">This page needs JavaScript to show live scores.</p></noscript>
  <script type="module" src="/js/event.js"></script>
</body>
</html>
