<!DOCTYPE html>
<html lang="en-GB">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Page not found | SHOT Event Clubhouse</title>
  <link rel="icon" href="/assets/brand/shot-logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;700;800;900&display=swap">

<body>
  <a class="skip" href="#main-content">Skip to content</a>

    <section class="ecs-lost">
      <div class="wrap">
        <p class="big" aria-hidden="true">404</p>
        <p class="kicker">Page not found</p>
        <h1 class="d2">That page is not on the team sheet.</h1>
        <p class="lede">The link may be old, or the event may not be public. Head back to the start or try the live demo.</p>

          <a class="btn btn-gold" href="/">Back to the home page</a>

      </div>

  <footer class="footer ecs-footer">
    <div class="wrap">
      <div class="ecs-footer-row">
        <a class="ecs-powered" href="https://shotclubhouse.com/" rel="noopener">
          <img src="/assets/brand/shot-logo.png" alt="" width="74" height="47">
          <span>Powered by SHOT</span>

        <nav class="ecs-footer-links" aria-label="Footer">
          <a href="mailto:contact@shotclubhouse.com">contact@shotclubhouse.com</a>

    </div>
